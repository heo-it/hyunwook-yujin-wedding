name: Deploy Website

on:
  push:
    branches:
      - develop # 배포 테스트 후 master로 교체

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
    - name: Set staging environment varibales
        run: |
          echo "PUBLIC_AI_NAVER_API_CLIENT_ID=${{ vars.PUBLIC_AI_NAVER_API_CLIENT_ID }}" >> .env
          echo "PUBLIC_T_MAP_APP_KEY=${{ vars.PUBLIC_T_MAP_APP_KEY }}" >> .env
          echo "PUBLIC_CDN_URL=${{ vars.PUBLIC_CDN_URL }}" >> .env
      - name: Install modules
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Deploy to S3
        run: aws s3 sync --delete ./dist/ s3://${{ secrets.BUCKET_ID }}
      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
